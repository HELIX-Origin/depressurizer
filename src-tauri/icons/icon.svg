<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1626" />
      <stop offset="50%" stop-color="#07111f" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <!-- Obsidian Rim Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48d8f2" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b06cff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Steam Core Arm Gradient -->
    <linearGradient id="arm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48d8f2" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#b06cff" />
    </linearGradient>

    <!-- Valve Relief / Accent Glow -->
    <linearGradient id="valve-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b06cff" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48d8f2" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#b06cff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07111f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#center-glow)" />

  <!-- Squircle Base -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="108"
    fill="url(#bg-grad)"
    stroke="url(#rim-grad)"
    stroke-width="4"
  />

  <!-- Subtle Inner Grid / Pressure Dial Reticle -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="rgba(72, 216, 242, 0.08)" stroke-width="2" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(176, 108, 255, 0.08)" stroke-width="2" />

  <!-- STEAM-INSPIRED CRANK / PISTON WITH DEPRESSURIZING RELIEF VALVES & TAG HIERARCHY -->
  <g transform="translate(10, 0)">
    <!-- Depressurizer Release Valve Plume / Organizing Arcs -->
    <path
      d="M 246,134 A 122,122 0 0,1 368,256"
      fill="none"
      stroke="url(#valve-grad)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-dasharray="16 12"
      opacity="0.85"
    />
    <path
      d="M 230,110 A 146,146 0 0,1 396,256"
      fill="none"
      stroke="url(#arm-grad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="6 14"
      opacity="0.5"
    />

    <!-- Connecting Arm (Steam Mechanical Crank with Chamfered Edges) -->
    <path
      d="M 176,336 L 314,198"
      stroke="url(#arm-grad)"
      stroke-width="44"
      stroke-linecap="round"
      filter="url(#cyan-glow)"
    />
    <path
      d="M 176,336 L 314,198"
      stroke="#0a192f"
      stroke-width="28"
      stroke-linecap="round"
    />

    <!-- Secondary Category Branch Link (Categorizer Tag Arm) -->
    <path
      d="M 314,198 L 364,248"
      stroke="url(#arm-grad)"
      stroke-width="22"
      stroke-linecap="round"
    />
    <path
      d="M 314,198 L 364,248"
      stroke="#0a192f"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Large Crank Pivot Circle (Main Steam Joint) -->
    <circle
      cx="176"
      cy="336"
      r="68"
      fill="#07111f"
      stroke="url(#arm-grad)"
      stroke-width="14"
    />
    <circle
      cx="176"
      cy="336"
      r="32"
      fill="url(#arm-grad)"
    />
    <circle
      cx="176"
      cy="336"
      r="16"
      fill="#07111f"
    />

    <!-- Top Piston Pivot Circle -->
    <circle
      cx="314"
      cy="198"
      r="44"
      fill="#07111f"
      stroke="url(#arm-grad)"
      stroke-width="12"
    />
    <circle
      cx="314"
      cy="198"
      r="18"
      fill="#48d8f2"
    />

    <!-- Secondary Category Node (Categorization Indicator) -->
    <circle
      cx="364"
      cy="248"
      r="28"
      fill="#07111f"
      stroke="url(#valve-grad)"
      stroke-width="8"
    />
    <circle
      cx="364"
      cy="248"
      r="10"
      fill="#b06cff"
    />

    <!-- Pressure Gauge Needle Point / Precision Indexer -->
    <polygon
      points="314,182 322,198 306,198"
      fill="#48d8f2"
    />
  </g>
</svg>
