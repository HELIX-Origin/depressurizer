<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sideBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="45%" stop-color="#07111f"/>
      <stop offset="85%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#02050a"/>
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="sideGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#48d8f2" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#b06cff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>

    <!-- Arm / Crank Gradient -->
    <linearGradient id="sideArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48d8f2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#b06cff"/>
    </linearGradient>

    <!-- Relief Valve Gradient -->
    <linearGradient id="sideValve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b06cff"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Piston Glow -->
    <radialGradient id="pistonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#48d8f2"/>
      <stop offset="100%" stop-color="#07111f"/>
    </radialGradient>
  </defs>

  <!-- 1. Background -->
  <rect width="164" height="314" fill="url(#sideBg)"/>

  <!-- 2. Technical Dial / Reticle Lines -->
  <g opacity="0.25">
    <path d="M0 50 h35 l15 15 h114" stroke="#48d8f2" stroke-width="1" fill="none"/>
    <path d="M164 215 h-35 l-15 -15 h-114" stroke="#b06cff" stroke-width="1" fill="none"/>
    <path d="M18 0 v40 l12 12 v130 l-12 12 v120" stroke="#38bdf8" stroke-width="1" fill="none"/>
    <path d="M146 0 v70 l-12 12 v110 l12 12 v110" stroke="#b06cff" stroke-width="1" fill="none"/>
    <circle cx="50" cy="65" r="2" fill="#48d8f2"/>
    <circle cx="114" cy="200" r="2" fill="#b06cff"/>
  </g>

  <!-- 3. Ambient Glow -->
  <circle cx="82" cy="115" r="70" fill="url(#sideGlow)"/>

  <!-- 4. Top Organization Tag -->
  <g transform="translate(82, 34)">
    <text text-anchor="middle" fill="#48d8f2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="2.5">HELIX ORIGIN</text>
  </g>

  <!-- 5. Centered Steam Mechanical Depressurizer Icon Emblem -->
  <g transform="translate(82, 115) scale(0.35)">
    <!-- Dial Circles -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#48d8f2" stroke-width="3" stroke-dasharray="6 10" opacity="0.3"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#b06cff" stroke-width="2.5" opacity="0.3"/>

    <!-- Pressure Relief Arcs -->
    <path d="M -20,-110 A 110,110 0 0,1 110,20" fill="none" stroke="url(#sideValve)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.9"/>
    <path d="M -40,-130 A 136,136 0 0,1 136,30" fill="none" stroke="url(#sideArm)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Connecting Crank Arm -->
    <line x1="-70" y1="70" x2="60" y2="-60" stroke="url(#sideArm)" stroke-width="36" stroke-linecap="round"/>
    <line x1="-70" y1="70" x2="60" y2="-60" stroke="#07111f" stroke-width="22" stroke-linecap="round"/>

    <!-- Secondary Category Branch Link -->
    <line x1="60" y1="-60" x2="90" y2="40" stroke="#b06cff" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.8"/>
    <circle cx="90" cy="40" r="18" fill="#140a2a" stroke="#b06cff" stroke-width="4"/>
    <circle cx="90" cy="40" r="7" fill="#f43f5e"/>

    <!-- Main Crank Hub (Steam Piston Axis) -->
    <circle cx="-70" cy="70" r="46" fill="#07111f" stroke="url(#sideArm)" stroke-width="8"/>
    <circle cx="-70" cy="70" r="30" fill="#0d1b2d" stroke="#48d8f2" stroke-width="3"/>
    <circle cx="-70" cy="70" r="14" fill="#48d8f2"/>

    <!-- Top Piston Head -->
    <circle cx="60" cy="-60" r="36" fill="#07111f" stroke="url(#sideArm)" stroke-width="7"/>
    <circle cx="60" cy="-60" r="22" fill="#140a2a" stroke="#b06cff" stroke-width="3"/>
    <circle cx="60" cy="-60" r="10" fill="#ffffff"/>
  </g>

  <!-- 6. Divider Line -->
  <line x1="24" y1="195" x2="140" y2="195" stroke="#48d8f2" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- 7. Bottom Branding Text -->
  <g transform="translate(82, 222)">
    <text text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">DEPRESSURIZER</text>
    <text y="17" text-anchor="middle" fill="#48d8f2" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">STEAM LIBRARY</text>
    <text y="30" text-anchor="middle" fill="#c084fc" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">CATEGORIZER</text>
  </g>

  <!-- 8. Feature Tags -->
  <g transform="translate(82, 280)" opacity="0.85">
    <text text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.8">AUTOCAT ENGINE</text>
    <text y="13" text-anchor="middle" fill="#b06cff" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.8">CROSS-PLATFORM</text>
  </g>
</svg>
